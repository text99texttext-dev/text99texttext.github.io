/* ===== Hero ===== */

.hero{
    width:100%;
    min-height:100vh;
    background:linear-gradient(135deg,#111,#444);

    align-items:center;

}

.hero-content{

}

.avatar{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid rgba(255,255,255,.2);

}

.hero h1{

    letter-spacing:2px;
}

.hero p{
    font-size:18px;

}

.hero-btn{
    display:inline-block;
    padding:14px 36px;
    background:white;
    color:#111;
    text-decoration:none;
    border-radius:50px;
    font-weight:700;
    transition:.3s;
}

.hero-btn:hover{
    background:#00d8cd;
    transform:translateY(-3px);
}

a{
color: #ffffff;text-decoration: none;

}
a:hover{
color: #fff1a1;

/* ===== Portfolio ===== */

.portfolio{
    max-width:1200px;
    margin:auto;
    padding:100px 20px;
}

.section-title{
    text-align:center;
    font-size:42px;
    margin-bottom:60px;
    position:relative;
}

.section-title::after{
    content:'';
    width:100px;
    height:4px;
    background:#111;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:-15px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.gallery-item img{
    width:100%;
    height:280px;
    object-fit:cover;
    display:block;
    transition:.5s;
}

.gallery-item:hover img{
    transform:scale(1.08);
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:22px;
    opacity:0;
    transition:.4s;
}

.gallery-item:hover .overlay{
    opacity:1;
}

/* ===== Lightbox ===== */

.lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:999;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.lightbox img{
    max-width:90%;
    max-height:90vh;
    border-radius:15px;
    box-shadow:0 0 30px rgba(255,255,255,.15);
}

.close{
    position:absolute;
    top:30px;
    right:40px;
    color:white;
    font-size:50px;
    cursor:pointer;
}

  /* 圖片容器 */
    .gallery {
      display: flex;
      justify-content: center;

    /* --- 縮圖樣式 --- */
    .lightbox-trigger {
      width: 250px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, opacity 0.2s;
    }
    /* 滑鼠移上去時的提示效果 */
    .lightbox-trigger:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    /* --- 黑底放大遮罩層 (Lightbox Overlay) --- */
    .modal-overlay {
      display: none; /* 預設隱藏 */
      position: fixed;
      z-index: 9999; /* 確保在最上層 */
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85); /* 黑色背景，透明度 85% */
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    /* 當遮罩被激活時 */
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    /* 放大後的圖片 */
    .modal-img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-img {
      transform: scale(1); /* 彈出放大動畫 */
    }

    /* 關閉按鈕 (右上角 X) */
    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: #ccc;
    }
    
    /* 當打開放大圖時，鎖定網頁主體的滾動條 */
    body.modal-open {
      overflow: hidden;
    }
#rightBar {

  <div id="imageModal" class="modal-overlay">

  </div>
 <script>
    document.addEventListener('DOMContentLoaded', function() {
      const triggers = document.querySelectorAll('.lightbox-trigger');
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalTargetImg');
      const closeBtn = document.getElementById('closeModal');

      // 打開遮罩的函式
      function openModal(imgSrc) {
        modalImg.src = imgSrc;
        modal.classList.add('active');
        document.body.classList.add('modal-open'); // 鎖定網頁滾動
      }

      // 關閉遮罩的函式
      function closeModal() {
        modal.classList.remove('active');
        document.body.classList.remove('modal-open'); // 解除鎖定滾動
        // 稍微延遲清空路徑，避免關閉動畫時圖片瞬間消失
        setTimeout(() => { modalImg.src = ''; }, 300);
      }

      // 1. 為所有設定了 class 的圖片綁定點擊事件
      triggers.forEach(trigger => {
        trigger.addEventListener('click', function() {
          openModal(this.src);
        });
      });

      // 2. 點擊 X 按鈕關閉
      closeBtn.addEventListener('click', closeModal);

      // 3. 點擊黑底任何地方（除了圖片本身）也能關閉
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closeModal();
        }
      });

      // 4. 按下鍵盤 Esc 鍵也能關閉（加分體驗）
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeModal();
        }
      });
    });
  </script>
